name: Analyse historique

# Etude hors ligne : 5 ans de cours et de dividendes pour l'univers suivi, plus
# quelques fondamentaux (analyse/fondamentaux.json, lu chaque jour par la veille
# de mes-actions pour juger les bonnes affaires). Tourne tout seul le 1er de
# chaque mois a 04:00 UTC, pour que la revue mensuelle du 5 parte de donnees
# fraiches ; aussi a la main, ou quand le script ou ce workflow est modifie.

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'scripts/historique.py', '.github/workflows/analyse.yml' ]

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependances
        run: pip install -r requirements.txt

      - name: Historique et fondamentaux
        run: python scripts/historique.py

      - name: Commit du dossier analyse
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analyse
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "analyse : historique et fondamentaux $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 10
            done
          fi
